<style>
:root{--bg:#F1F5F9;--panel:#FFFFFF;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;--accent:#1E3A5F}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.1px}
h1 small{display:block;font-weight:400;color:var(--muted);font-size:14px;margin-top:2px}
.tabs{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:9px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{background:#F8FAFC;border-color:#CBD5E1}
.tabs button{border:0;background:transparent;padding:6px 14px}
.tabs button.active{background:var(--panel);box-shadow:0 1px 2px rgba(15,23,42,.12);font-weight:600;color:var(--accent)}
#stage{position:relative;flex:1;overflow:hidden;background:#fff;cursor:grab;touch-action:none;margin:14px 20px;border:1px solid var(--line);border-radius:10px}
#stage.drag{cursor:grabbing}
#canvas{position:absolute;left:0;top:0;transform-origin:0 0}
#canvas svg{display:block;text-rendering:geometricPrecision;shape-rendering:geometricPrecision}
#status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;padding:20px;text-align:center;pointer-events:none}
#hint{position:absolute;right:12px;bottom:10px;font-size:13px;color:var(--muted);background:rgba(255,255,255,.92);border:1px solid var(--line);padding:4px 10px;border-radius:6px;pointer-events:none}
#desc{padding:0 20px 14px;font-size:14px;color:var(--muted)}
/* diagram look */
#canvas .cluster rect{rx:12px;ry:12px}
#canvas .cluster text,#canvas .cluster span{font-weight:700 !important;font-size:20px !important}
#canvas .node rect{rx:8px;ry:8px}
#canvas .node text,#canvas .nodeLabel{fill:#ffffff !important;color:#ffffff !important;font-size:16px !important;font-weight:500}
#canvas .edgePath path,#canvas path.flowchart-link{stroke:#334155 !important;stroke-width:2px !important;fill:none}
#canvas marker path{fill:#334155 !important;stroke:#334155 !important}
#canvas .edgeLabel rect{fill:#ffffff !important;opacity:1 !important;stroke:#CBD5E1}
#canvas .edgeLabel,#canvas .edgeLabel text{fill:#0F172A !important;color:#0F172A !important;font-size:15px !important;font-weight:600}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
(function(){
  var DIAGRAMS=[
    {id:"architecture",label:"Architecture (overview)",desc:"High-level architecture: frontend, FastAPI backend, AI agents, AI providers and Supabase."},
    {id:"system-design",label:"System Design (full)",desc:"Detailed system design: client layer, API gateway, multi-agent orchestrator, services, AI providers and data layer."}
  ];
  var stage=document.getElementById("stage"),canvas=document.getElementById("canvas"),status=document.getElementById("status");
  var tabs=document.getElementById("tabs"),desc=document.getElementById("desc"),sub=document.getElementById("sub");
  var cur=null,s=1,tx=0,ty=0,nw=0,nh=0,cache={};
  function apply(){canvas.style.transform="translate("+tx+"px,"+ty+"px) scale("+s+")"}
  function fit(){
    if(!nw)return;
    var W=stage.clientWidth,H=stage.clientHeight,pad=24;
    s=Math.min((W-pad)/nw,(H-pad)/nh);
    tx=(W-nw*s)/2;ty=(H-nh*s)/2;apply();
  }
  function zoomAt(f,cx,cy){
    var ns=Math.min(Math.max(s*f,0.05),8);f=ns/s;
    tx=cx-(cx-tx)*f;ty=cy-(cy-ty)*f;s=ns;apply();
  }
  function center(f){zoomAt(f,stage.clientWidth/2,stage.clientHeight/2)}
  function raw(id){return document.getElementById("src-"+id).textContent.trim()}
  function src(id){
    var text=raw(id)
      .replace(/^%%\{init[\s\S]*?\}%%\s*/m,"")
      .replace(/^\s*style\s+\S+\s+fill.*$/gm,"")
      .replace(/\u2318/g,"Cmd+")
      .replace(/[\p{Extended_Pictographic}\uFE0F\u200D]\s*/gu,"");
    return text+"\n"+colorize(text);
  }
  var PAL={
    /* architecture overview */
    USER:"#1E293B",FRONTEND:"#1D4ED8",BACKEND:"#6D28D9",AGENTS:"#C2410C",AI:"#047857",DB:"#BE185D",
    /* full system design */
    CLIENT:"#1D4ED8",AUTH_PAGES:"#2563EB",APP_PAGES:"#1E40AF",HOOKS:"#0369A1",UI_LIB:"#4338CA",FE_LIB:"#0F766E",
    GATEWAY:"#0E7490",ROUTES:"#0E7490",
    INTEL:"#6D28D9",AGENT_POOL:"#C2410C",
    SERVICES:"#047857",NUTRITION:"#15803D",SAFETY:"#B91C1C",FOOD_SVC:"#0F766E",RAG:"#4F46E5",
    AI_LAYER:"#B45309",GROQ:"#B45309",GOOGLE:"#1D4ED8",
    DATA:"#BE185D",TABLES:"#BE185D",DB_FEATURES:"#7E22CE"
  };
  function mix(hex,k){
    var n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
    function m(c){return Math.round(c*(1-k)+255*k)}
    return "#"+[m(r),m(g),m(b)].map(function(v){return ("0"+v.toString(16)).slice(-2)}).join("");
  }
  function colorize(text){
    var stack=[],nodes={},subs=[],out=[];
    text.split("\n").forEach(function(line){
      if(/^\s*%%/.test(line))return;
      var m=line.match(/^\s*subgraph\s+([A-Za-z_]\w*)/);
      if(m){subs.push({id:m[1],depth:stack.length,parent:stack[stack.length-1]});stack.push(m[1]);return}
      if(/^\s*end\s*$/.test(line)){stack.pop();return}
      m=line.match(/^\s*([A-Za-z_]\w*)\s*(\[|\(|\{|>)/);
      if(m&&stack.length&&m[1]!=="subgraph"){nodes[m[1]]=stack.slice()}
    });
    function colorOf(chain){
      for(var i=chain.length-1;i>=0;i--){if(PAL[chain[i]])return PAL[chain[i]]}
      return "#334155";
    }
    var byColor={};
    Object.keys(nodes).forEach(function(n){var c=colorOf(nodes[n]);(byColor[c]=byColor[c]||[]).push(n)});
    Object.keys(byColor).forEach(function(c,i){
      out.push("classDef k"+i+" fill:"+c+",stroke:"+mix(c,0.0)+",color:#ffffff,stroke-width:2px;");
      out.push("class "+byColor[c].join(",")+" k"+i+";");
    });
    var chainOf={};subs.forEach(function(s){chainOf[s.id]=(s.parent?chainOf[s.parent]:[]).concat(s.id)});
    window.__clusterColors=window.__clusterColors||{};
    subs.forEach(function(s){
      var c=colorOf(chainOf[s.id]);
      out.push("style "+s.id+" fill:"+mix(c,s.depth?0.94:0.88)+",stroke:"+c+",stroke-width:"+(s.depth?2:3)+"px,color:"+c+";");
      window.__clusterColors[s.id]=c;
    });
    return out.join("\n");
  }
  function clusterCss(){
    var css="";
    Object.keys(window.__clusterColors||{}).forEach(function(id){
      css+='#canvas g.cluster[id="'+id+'"] text,#canvas g.cluster[id="'+id+'"] span{fill:'+window.__clusterColors[id]+' !important;color:'+window.__clusterColors[id]+' !important}';
    });
    var st=document.getElementById("clusterCss");
    if(!st){st=document.createElement("style");st.id="clusterCss";document.head.appendChild(st)}
    st.textContent=css;
  }
  function show(id){
    var d=DIAGRAMS.filter(function(x){return x.id===id})[0]||DIAGRAMS[0];
    cur=d;
    Array.prototype.forEach.call(tabs.children,function(b){b.classList.toggle("active",b.dataset.id===d.id)});
    desc.textContent=d.desc;sub.textContent=d.label;
    try{history.replaceState(null,"","#"+d.id)}catch(e){location.hash=d.id}
    canvas.innerHTML="";status.style.display="flex";status.textContent="Rendering diagram…";nw=0;
    src(d.id);clusterCss();var p=cache[d.id]?Promise.resolve(cache[d.id]):mermaid.render("m-"+d.id+"-"+Date.now(),src(d.id)).then(function(r){return cache[d.id]=r.svg});
    p.then(function(svg){
      if(cur!==d)return;
      canvas.innerHTML=svg;
      var el=canvas.querySelector("svg");
      var vb=el.viewBox&&el.viewBox.baseVal;
      nw=(vb&&vb.width)||el.getBoundingClientRect().width;
      nh=(vb&&vb.height)||el.getBoundingClientRect().height;
      el.removeAttribute("style");el.setAttribute("width",nw);el.setAttribute("height",nh);
      status.style.display="none";fit();
    }).catch(function(e){status.textContent="Could not render diagram: "+(e&&e.message||e)});
  }
  DIAGRAMS.forEach(function(d){
    var b=document.createElement("button");b.textContent=d.label;b.dataset.id=d.id;
    b.onclick=function(){show(d.id)};tabs.appendChild(b);
  });
  mermaid.initialize({startOnLoad:false,securityLevel:"loose",maxTextSize:200000,theme:"base",
    themeVariables:{fontFamily:'Inter,"Segoe UI",system-ui,sans-serif',fontSize:"18px",primaryColor:"#1D4ED8",primaryTextColor:"#FFFFFF",primaryBorderColor:"#94A3B8",lineColor:"#64748B",clusterBkg:"#F8FAFC",clusterBorder:"#CBD5E1",edgeLabelBackground:"#FFFFFF"},
    flowchart:{useMaxWidth:false,htmlLabels:false,curve:"basis",nodeSpacing:50,rankSpacing:80,padding:18}});

  stage.addEventListener("wheel",function(e){
    e.preventDefault();var r=stage.getBoundingClientRect();
    zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);
  },{passive:false});
  var pts={},last=null,pinch=0;
  stage.addEventListener("pointerdown",function(e){stage.setPointerCapture(e.pointerId);pts[e.pointerId]=e;last={x:e.clientX,y:e.clientY};stage.classList.add("drag")});
  stage.addEventListener("pointermove",function(e){
    if(!pts[e.pointerId])return;pts[e.pointerId]=e;
    var ids=Object.keys(pts);
    if(ids.length===2){
      var a=pts[ids[0]],b=pts[ids[1]],dist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
      if(pinch){var r=stage.getBoundingClientRect();zoomAt(dist/pinch,(a.clientX+b.clientX)/2-r.left,(a.clientY+b.clientY)/2-r.top)}
      pinch=dist;
    }else if(last){tx+=e.clientX-last.x;ty+=e.clientY-last.y;last={x:e.clientX,y:e.clientY};apply()}
  });
  function up(e){delete pts[e.pointerId];pinch=0;last=Object.keys(pts).length?{x:e.clientX,y:e.clientY}:null;if(!last)stage.classList.remove("drag")}
  stage.addEventListener("pointerup",up);stage.addEventListener("pointercancel",up);
  stage.addEventListener("dblclick",fit);
  document.getElementById("zin").onclick=function(){center(1.25)};
  document.getElementById("zout").onclick=function(){center(1/1.25)};
  document.getElementById("fit").onclick=fit;
  document.getElementById("one").onclick=function(){s=1;tx=(stage.clientWidth-nw)/2;ty=20;apply()};
  var dls=null;
  function dl(name,text){if(dls){dls.save({filename:name,data:text}).catch(function(){})}}
  var bS=document.getElementById("svgdl"),bT=document.getElementById("srcdl");
  bS.hidden=bT.hidden=true;
  if(window.claude&&claude.use){claude.use("downloads").then(function(d){if(d){dls=d;bS.hidden=bT.hidden=false}}).catch(function(){})}
  document.getElementById("svgdl").onclick=function(){if(cache[cur.id])dl(cur.id+".svg",cache[cur.id])};
  document.getElementById("srcdl").onclick=function(){dl(cur.id+"-mermaid-source.txt",raw(cur.id))};
  window.addEventListener("resize",fit);
  window.addEventListener("hashchange",function(){var h=location.hash.slice(1);if(h&&(!cur||h!==cur.id))show(h)});
  if(typeof mermaid==="undefined"){status.textContent="Could not load the Mermaid library (check your internet connection)."}
  else show(location.hash.slice(1)||DIAGRAMS[0].id);
})();
</script>
</body>
